# STM32Cube HAL driver catalog. Version is not pinned here; Forge.toml supplies it
# and {version} is substituted into url (with tag_prefix) and archive_root.

stm32f0-hal:
  name: stm32f0-hal
  url: https://github.com/STMicroelectronics/stm32f0xx-hal-driver/archive/refs/tags/{version}.tar.gz
  tag_prefix: v
  archive_root: stm32f0xx-hal-driver-{version}
  include:
    - Inc
  sources:
    - Src

stm32f1-hal:
  name: stm32f1-hal
  url: https://github.com/STMicroelectronics/stm32f1xx-hal-driver/archive/refs/tags/{version}.tar.gz
  tag_prefix: v
  archive_root: stm32f1xx-hal-driver-{version}
  include:
    - Inc
  sources:
    - Src
  depends:
    - cmsis5
    - stm32f1-cmsis-device

