# Relocatable toolchain binaries. Versions and URLs live here, not in Forge.toml.
# {version} is substituted from the version field. Host gcc is not an entry.

cmake:
  name: cmake
  version: "4.5.1"
  binary: bin/cmake
  os:
    linux:
      url: https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-linux-x86_64.tar.gz
      sha256: 83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d
      archive_root: cmake-{version}-linux-x86_64
    windows:
      url: https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-windows-x86_64.zip
      sha256: bfe6eadb245dc8213e0d3feea316b520cb2aae92f5667ffd76059ba6b05c430c
      archive_root: cmake-{version}-windows-x86_64

